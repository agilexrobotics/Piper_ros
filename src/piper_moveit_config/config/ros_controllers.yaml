# Simulation settings for using moveit_sim_controllers
moveit_sim_hw_interface:
  joint_model_group: arm
  joint_model_group_pose: home

# Settings for ros_control control loop
generic_hw_control_loop:
  loop_hz: 300
  cycle_time_error_threshold: 0.01

# Settings for ros_control hardware interface
hardware_interface:
  joints:
    - joint1
    - joint2
    - joint3
    - joint4
    - joint5
    - joint6
    - joint7
    - joint8
  sim_control_mode: 1  # 0: position, 1: velocity

# Publish all joint states
joint_state_controller:
  type: joint_state_controller/JointStateController
  publish_rate: 50

# Controllers for the arm
arm_controller:
  type: position_controllers/JointTrajectoryController
  joints:
    - joint1
    - joint2
    - joint3
    - joint4
    - joint5
    - joint6
  # constraints:
  #   goal_time: 2.0
  #   stopped_velocity_tolerance: 0.05
  #   joint1: { trajectory: 0.1, goal: 0.1 }
  #   joint2: { trajectory: 0.1, goal: 0.1 }
  #   joint3: { trajectory: 0.1, goal: 0.1 }
  #   joint4: { trajectory: 0.1, goal: 0.1 }
  #   joint5: { trajectory: 0.1, goal: 0.1 }
  #   joint6: { trajectory: 0.1, goal: 0.1 }
  # state_publish_rate: 25
  # action_monitor_rate: 10

# Controllers for the gripper
gripper_controller:
  type: position_controllers/JointTrajectoryController
  joints:
    - joint7
    - joint8
